<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - ともだちのたね</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>▼サンプル太郎</h1>
      <div class="header-actions">
        <button class="icon-btn settings-btn" aria-label="設定">
          <img src="./images/icon_settings.png" alt="設定">
        </button>
      </div>
    </header>

    <main class="content">
      <div class="avatar-container">
        <img src="./images/default_avatar.png" alt="プロフィール画像" class="avatar-img">
      </div>

      <div class="profile-card">
        <div class="profile-info-list">
          <div class="info-item"><span class="info-label">▼誕生日</span><span class="info-value">4月1日</span></div>
          <div class="info-item"><span class="info-label">▼星座</span><span class="info-value">おひつじ座</span></div>
          <div class="info-item"><span class="info-label">▼血液型</span><span class="info-value">A型</span></div>
          <div class="info-item"><span class="info-label">▼性別</span><span class="info-value">未選択</span></div>

          <div style="margin-top: 12px; margin-bottom: 6px; font-weight: 600; color: #4b5563; font-size: 0.85rem;">好きな〇〇トップ3</div>
          <div class="info-item"><span class="info-label">1位</span><span class="info-value">サンプルソング</span></div>
          <div class="info-item"><span class="info-label">2位</span><span class="info-value">サンプルゲーム</span></div>
          <div class="info-item"><span class="info-label">3位</span><span class="info-value">サンプルスポーツ</span></div>

          <div class="info-item" style="margin-top: 12px;"><span class="info-label">趣味</span><span class="info-value">読書</span></div>
          <div class="info-item"><span class="info-label">ハマっていること</span><span class="info-value">写真撮影</span></div>
          <div class="info-item"><span class="info-label">音楽</span><span class="info-value">サンプルポップス</span></div>
          <div class="info-item"><span class="info-label">MBTI</span><span class="info-value">ENFP</span></div>
          <div class="info-item"><span class="info-label">将来の夢</span><span class="info-value">サンプル職業</span></div>
          <div class="info-item" style="margin-top: 12px;"><span class="info-label">▼ex) 自分の第一印象</span><span class="info-value">明るい人</span></div>
        </div>
      </div>
    </main>
    <footer class="nav-bar">
      <a href="./add_friend.html" class="nav-link">友達追加</a>
      <a href="./friend_profile.html" class="nav-link">友達プロフィール</a>
      <a href="./edit_profile.html" class="nav-link">プロフィール編集</a>
    </footer>
  </div>
  <script src="./script.js"></script>
</body>
</html>
