<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友達追加 - ともだちのたね</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>友達追加</h1>
    </header>

    <main class="content">
      <div class="search-box">
        <img src="./images/icon_search.png" alt="検索">
        <input type="text" placeholder="検索">
      </div>

      <h2 style="font-size: 0.95rem; color: #4b5563; margin-bottom: 14px; font-weight: 600;">おすすめ</h2>

      <div class="user-list">
        <div class="user-item">
          <div class="user-item-info">
            <img src="./images/friend_avatar_a.png" alt="利用者A" class="user-item-avatar">
            <span style="font-weight: 600;">利用者A</span>
          </div>
          <button class="add-btn" aria-label="追加">＋</button>
        </div>

        <div class="user-item">
          <div class="user-item-info">
            <img src="./images/friend_avatar_b.png" alt="利用者B" class="user-item-avatar">
            <span style="font-weight: 600;">利用者B</span>
          </div>
          <button class="add-btn" aria-label="追加">＋</button>
        </div>

        <div class="user-item">
          <div class="user-item-info">
            <img src="./images/default_avatar.png" alt="利用者C" class="user-item-avatar">
            <span style="font-weight: 600;">利用者C</span>
          </div>
          <button class="add-btn" aria-label="追加">＋</button>
        </div>

        <div class="user-item">
          <div class="user-item-info">
            <img src="./images/default_avatar.png" alt="利用者D" class="user-item-avatar">
            <span style="font-weight: 600;">利用者D</span>
          </div>
          <button class="add-btn" aria-label="追加">＋</button>
        </div>
      </div>
    </main>
    <footer class="nav-bar">
      <a href="./home.html" class="nav-link">戻る</a>
      <a href="./friend_profile.html" class="nav-link">友達プロフィール</a>
      <a href="./edit_profile.html" class="nav-link">プロフィール編集</a>
    </footer>
  </div>
  <script src="./script.js"></script>
</body>
</html>
