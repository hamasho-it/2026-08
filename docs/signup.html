<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 - ともだちのたね</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./index.html" class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.85rem;">戻る</a>
      <h1>sign in</h1>
      <div style="width: 50px;"></div>
    </header>

    <main class="content">
      <div style="margin-top: 20px;">
        <h2 style="font-size: 1.2rem; margin-bottom: 24px; text-align: center;">新規登録</h2>

        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" class="form-control" placeholder="例: user_a@example.com">
        </div>

        <div class="form-group">
          <label>パスワード</label>
          <input type="password" class="form-control" placeholder="パスワードを入力">
        </div>

        <div style="margin-top: 32px;">
          <a href="./create_profile.html" class="btn btn-primary btn-block" style="padding: 12px;">新規登録</a>
        </div>
      </div>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
